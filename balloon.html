<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Pop the Balloons! 🎈</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎈</text></svg>"/>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Playfair+Display:ital,wght@0,700;1,400&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}

:root{
  --pink:#ff5fa3;--orange:#ffaa44;--green:#3ecf7a;--blue:#4fb5ff;
  --deep:#1a0a2e;--mid:#2d1250;--accent:#ff5fa3;
}

body{
  font-family:'Caveat',cursive;
  background:radial-gradient(ellipse at 20% 0%,#3d1060 0%,#1a0a2e 50%,#0d0618 100%);
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  overflow:hidden;position:relative;
}

/* Stars */
#stars{position:fixed;inset:0;pointer-events:none;z-index:0}
.star{
  position:absolute;background:#fff;border-radius:50%;
  animation:twinkle var(--dur,3s) ease-in-out infinite var(--delay,0s);
}
@keyframes twinkle{0%,100%{opacity:.2;transform:scale(1)}50%{opacity:1;transform:scale(1.4)}}

/* Bunting */
#bunting{
  position:fixed;top:0;left:0;width:100%;z-index:50;
  display:flex;align-items:flex-start;justify-content:center;
  padding-top:6px;gap:0;overflow:hidden;pointer-events:none;
}
.flag{
  width:0;height:0;
  border-left:20px solid transparent;border-right:20px solid transparent;border-top:36px solid var(--c,#ff5fa3);
  margin:0 3px;flex-shrink:0;
  animation:flagSwing 2s ease-in-out infinite;
  animation-delay:var(--fd,0s);
  filter:drop-shadow(0 3px 6px rgba(0,0,0,.4));
}
@keyframes flagSwing{0%,100%{transform:translateY(0)}50%{transform:translateY(6px)}}

/* Rope */
#bunting::before{
  content:'';position:absolute;top:6px;left:0;width:100%;height:2px;
  background:rgba(255,255,255,.5);box-shadow:0 0 8px rgba(255,255,255,.4);
}

/* Ambient glow orbs */
body::after,body::before{
  content:'';position:fixed;border-radius:50%;pointer-events:none;z-index:0;
  filter:blur(80px);opacity:.18;
}
body::before{width:400px;height:400px;top:10%;left:-100px;background:var(--pink)}
body::after{width:350px;height:350px;bottom:10%;right:-80px;background:var(--blue)}

/* Main container */
.game-wrap{
  position:relative;z-index:10;display:flex;flex-direction:column;
  align-items:center;width:100%;max-width:680px;padding:20px 16px 40px;
}

/* Title */
.title{
  font-family:'Playfair Display',serif;font-style:italic;
  font-size:clamp(1.6rem,4vw,2.4rem);font-weight:400;
  color:#fff;text-align:center;
  margin-top:70px;margin-bottom:40px;
  letter-spacing:.5px;
  text-shadow:0 0 30px rgba(255,95,163,.6),0 4px 12px rgba(0,0,0,.5);
  animation:titleFloat 4s ease-in-out infinite;
  transition:opacity .6s ease,transform .6s ease;
}
.title.gone{opacity:0;transform:translateY(-30px);pointer-events:none}
@keyframes titleFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

/* Instruction */
.instruction{
  font-size:1rem;color:rgba(255,255,255,.5);
  margin-top:-30px;margin-bottom:20px;
  letter-spacing:1px;font-family:'Caveat',cursive;
  animation:pulse 2s ease-in-out infinite;
}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:.9}}

/* Balloons grid */
.balloons-grid{
  display:flex;justify-content:center;align-items:flex-end;
  gap:clamp(12px,4vw,40px);padding:0 10px;
  min-height:420px;position:relative;
}

/* Each balloon unit */
.b-unit{
  display:flex;flex-direction:column;align-items:center;
  cursor:pointer;user-select:none;
  animation:floatUp var(--fd,3s) ease-in-out infinite;
  position:relative;
}
@keyframes floatUp{
  0%,100%{transform:translateY(0) rotate(-1.5deg)}
  50%{transform:translateY(-22px) rotate(1.5deg)}
}
.b-unit:nth-child(1){--fd:3s}
.b-unit:nth-child(2){--fd:3.6s}
.b-unit:nth-child(3){--fd:2.8s}
.b-unit:nth-child(4){--fd:4.1s}

/* Balloon body */
.balloon{
  position:relative;
  width:clamp(72px,14vw,110px);
  height:clamp(90px,18vw,138px);
  border-radius:50% 50% 46% 46%;
  transition:transform .25s cubic-bezier(.34,1.56,.64,1),filter .25s ease;
  will-change:transform;
}
.b-unit:hover .balloon{transform:scale(1.12)}
.b-unit:active .balloon{transform:scale(.94)}

/* Balloon colors */
.balloon.pink{
  background:radial-gradient(circle at 35% 32%,#ff8fbe 0%,#ff4fa3 55%,#c4356f 100%);
  box-shadow:inset -6px -10px 20px rgba(0,0,0,.25),inset 6px 6px 14px rgba(255,255,255,.3),0 12px 30px rgba(255,79,163,.4);
}
.balloon.orange{
  background:radial-gradient(circle at 35% 32%,#ffd080 0%,#ffaa44 55%,#c97a1e 100%);
  box-shadow:inset -6px -10px 20px rgba(0,0,0,.25),inset 6px 6px 14px rgba(255,255,255,.3),0 12px 30px rgba(255,170,68,.4);
}
.balloon.green{
  background:radial-gradient(circle at 35% 32%,#80e9a8 0%,#3ecf7a 55%,#1a9450 100%);
  box-shadow:inset -6px -10px 20px rgba(0,0,0,.25),inset 6px 6px 14px rgba(255,255,255,.3),0 12px 30px rgba(62,207,122,.4);
}
.balloon.blue{
  background:radial-gradient(circle at 35% 32%,#8dd6ff 0%,#4fb5ff 55%,#1a7ed4 100%);
  box-shadow:inset -6px -10px 20px rgba(0,0,0,.25),inset 6px 6px 14px rgba(255,255,255,.3),0 12px 30px rgba(79,181,255,.4);
}

/* Hover glow */
.b-unit:hover .balloon.pink{filter:drop-shadow(0 0 18px rgba(255,79,163,.7))}
.b-unit:hover .balloon.orange{filter:drop-shadow(0 0 18px rgba(255,170,68,.7))}
.b-unit:hover .balloon.green{filter:drop-shadow(0 0 18px rgba(62,207,122,.7))}
.b-unit:hover .balloon.blue{filter:drop-shadow(0 0 18px rgba(79,181,255,.7))}

/* Shine spots */
.shine{
  position:absolute;top:14%;left:18%;
  width:32%;height:36%;border-radius:50%;
  background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.75) 0%,rgba(255,255,255,.2) 50%,transparent 70%);
  pointer-events:none;
}
.shine2{
  position:absolute;bottom:22%;right:22%;
  width:18%;height:22%;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.35) 0%,transparent 70%);
  pointer-events:none;
}

/* Knot at bottom */
.knot{
  position:absolute;bottom:-10px;left:50%;transform:translateX(-50%);
  width:10px;height:12px;background:inherit;border-radius:50% 50% 40% 40%;
  filter:brightness(.7);
}

/* Balloon tip */
.balloon::after{
  content:'';position:absolute;bottom:-12px;left:50%;transform:translateX(-50%);
  width:4px;height:4px;border-radius:50%;background:rgba(255,255,255,.4);
}

/* String */
.string{
  width:1.5px;
  height:clamp(120px,22vw,200px);
  background:linear-gradient(to bottom,rgba(255,255,255,.7) 0%,rgba(255,255,255,.3) 100%);
  margin-top:2px;position:relative;
}

/* Tooltip */
.tooltip{
  position:absolute;top:-52px;left:50%;
  transform:translateX(-50%) scale(.85);
  background:rgba(255,255,255,.15);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.25);
  color:#fff;font-size:.95rem;padding:6px 14px;
  border-radius:20px;white-space:nowrap;
  opacity:0;pointer-events:none;
  transition:all .3s cubic-bezier(.68,-.55,.265,1.55);
  z-index:10;
}
.tooltip::after{
  content:'';position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);
  width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;
  border-top:6px solid rgba(255,255,255,.2);
}
.b-unit:hover:not(.popped) .tooltip{opacity:1;transform:translateX(-50%) scale(1) translateY(-4px)}

/* Word label */
.word-label{
  font-family:'Caveat',cursive;font-size:clamp(1.1rem,2.5vw,1.5rem);
  font-weight:700;color:#fff;margin-top:8px;
  opacity:0;transform:translateY(-8px);
  transition:all .35s ease;pointer-events:none;
  text-shadow:0 2px 8px rgba(0,0,0,.5);
}
.b-unit:hover:not(.popped) .word-label{opacity:1;transform:translateY(0)}

/* POP animation */
.b-unit.popped .balloon{animation:popBurst .5s ease-out forwards}
.b-unit.popped .string{animation:stringFall .6s ease-in forwards}
.b-unit.popped .word-label{opacity:0!important}
.b-unit.popped .tooltip{display:none}
@keyframes popBurst{
  0%{transform:scale(1);opacity:1}
  30%{transform:scale(1.5);opacity:.9}
  60%{transform:scale(1.2);opacity:.5}
  100%{transform:scale(0);opacity:0}
}
@keyframes stringFall{
  0%{transform:translateY(0) rotate(0);opacity:1}
  100%{transform:translateY(200px) rotate(35deg);opacity:0}
}

/* Revealed message words */
.msg-stage{
  position:relative;min-height:80px;display:flex;
  align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;
  margin-top:10px;
}
.msg-word{
  font-family:'Playfair Display',serif;font-style:italic;
  font-size:clamp(2rem,7vw,3.8rem);font-weight:700;
  animation:wordPop .6s cubic-bezier(.34,1.8,.64,1) both;
  filter:drop-shadow(0 4px 12px rgba(0,0,0,.4));
}
.msg-word:nth-child(1){color:var(--pink)}
.msg-word:nth-child(2){color:var(--orange)}
.msg-word:nth-child(3){color:var(--green)}
.msg-word:nth-child(4){color:var(--blue)}
@keyframes wordPop{
  0%{transform:scale(0) rotate(-10deg);opacity:0}
  70%{transform:scale(1.15) rotate(2deg)}
  100%{transform:scale(1) rotate(0);opacity:1}
}

/* Confetti layer */
#confetti{position:fixed;inset:0;pointer-events:none;z-index:200;overflow:hidden}
.cf{
  position:absolute;top:-20px;
  animation:cfFall var(--cd,3s) var(--cde,0s) ease-in both;
  pointer-events:none;
}
@keyframes cfFall{
  0%{transform:translateY(-20px) rotate(0) scale(1);opacity:1}
  80%{opacity:.7}
  100%{transform:translateY(110vh) rotate(720deg) scale(.8);opacity:0}
}

/* Polaroid */
#polaroid{
  position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  z-index:300;pointer-events:none;opacity:0;transform:scale(.5) rotate(-4deg);
  transition:all .7s cubic-bezier(.34,1.56,.64,1);
}
#polaroid.show{opacity:1;transform:scale(1) rotate(-2deg);pointer-events:auto;animation:polFloat 4s ease-in-out 1s infinite}
@keyframes polFloat{0%,100%{transform:scale(1) rotate(-2deg)}50%{transform:scale(1.02) rotate(2deg) translateY(-8px)}}
.pol-card{
  background:#fff;
  padding:14px 14px 56px;
  border-radius:3px;
  box-shadow:0 20px 60px rgba(0,0,0,.5),0 0 80px rgba(255,95,163,.3);
  max-width:min(300px,85vw);width:100%;
}
.pol-img{
  width:100%;height:min(280px,55vw);
  object-fit:cover;border-radius:2px;display:block;
  background:linear-gradient(135deg,#ffb3d1,#b3d4ff);/* fallback */
}
.pol-caption{
  font-family:'Caveat',cursive;font-size:1.4rem;font-weight:700;
  color:#ff4fa3;text-align:center;margin-top:14px;
}
.pol-sig{
  font-family:'Caveat',cursive;font-size:1rem;color:#888;
  text-align:center;margin-top:4px;font-style:italic;
}

/* Next button */
#nextBtn{
  position:fixed;bottom:32px;left:50%;transform:translateX(-50%) translateY(80px);
  opacity:0;z-index:400;transition:all .6s cubic-bezier(.34,1.56,.64,1);
  pointer-events:none;
}
#nextBtn.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
#nextBtn a{
  display:inline-flex;align-items:center;gap:8px;
  font-family:'Caveat',cursive;font-size:1.4rem;font-weight:700;
  color:#fff;text-decoration:none;
  background:linear-gradient(135deg,rgba(255,95,163,.8),rgba(79,181,255,.8));
  backdrop-filter:blur(12px);
  padding:14px 34px;border-radius:50px;
  border:1.5px solid rgba(255,255,255,.3);
  box-shadow:0 8px 32px rgba(255,95,163,.4);
  transition:transform .2s ease,box-shadow .2s ease;
}
#nextBtn a:hover{transform:scale(1.06);box-shadow:0 12px 40px rgba(255,95,163,.6)}

/* Floating hearts & petals */
.fx-layer{position:fixed;inset:0;pointer-events:none;z-index:3;overflow:hidden}
.fheart,.fpetal{position:absolute;animation:riseUp var(--dur,8s) var(--del,0s) ease-in-out infinite;opacity:0;font-size:var(--fs,20px)}
@keyframes riseUp{
  0%{opacity:0;transform:translateY(0) scale(.7) rotate(0)}
  15%{opacity:.8}
  85%{opacity:.3}
  100%{opacity:0;transform:translateY(-110vh) scale(1.3) rotate(360deg)}
}

/* Ripple on click */
.ripple{
  position:fixed;border-radius:50%;pointer-events:none;z-index:999;
  transform:scale(0);animation:rippleOut .6s ease-out forwards;
}
@keyframes rippleOut{to{transform:scale(6);opacity:0}}

/* Responsive tweaks */
@media(max-width:480px){
  .balloons-grid{gap:10px;min-height:340px}
  .string{height:100px}
}
</style>
</head>
<body>

<div id="stars"></div>

<!-- Bunting -->
<div id="bunting"></div>

<!-- Ambient hearts -->
<div class="fx-layer" id="fxLayer"></div>

<div class="game-wrap">
  <h1 class="title" id="mainTitle">✨ Pop all 4 balloons ✨</h1>
  <p class="instruction" id="instruction">Tap to reveal a surprise message 💌</p>

  <div class="balloons-grid" id="balloonsGrid">

    <div class="b-unit" data-word="You" data-idx="0">
      <div class="tooltip">💕 Pop me!</div>
      <div class="balloon pink">
        <div class="shine"></div><div class="shine2"></div>
      </div>
      <div class="string"></div>
      <div class="word-label">You</div>
    </div>

    <div class="b-unit" data-word="are" data-idx="1">
      <div class="tooltip">💕 Pop me!</div>
      <div class="balloon orange">
        <div class="shine"></div><div class="shine2"></div>
      </div>
      <div class="string"></div>
      <div class="word-label">are</div>
    </div>

    <div class="b-unit" data-word="a" data-idx="2">
      <div class="tooltip">💕 Pop me!</div>
      <div class="balloon green">
        <div class="shine"></div><div class="shine2"></div>
      </div>
      <div class="string"></div>
      <div class="word-label">a</div>
    </div>

    <div class="b-unit" data-word="Cutiee" data-idx="3">
      <div class="tooltip">💕 Pop me!</div>
      <div class="balloon blue">
        <div class="shine"></div><div class="shine2"></div>
      </div>
      <div class="string"></div>
      <div class="word-label">Cutiee</div>
    </div>

  </div>

  <div class="msg-stage" id="msgStage"></div>
</div>

<!-- Confetti -->
<div id="confetti"></div>

<!-- Polaroid reveal -->
<div id="polaroid">
  <div class="pol-card">
    <img src="assets/love_kiss.gif" alt="For My Premii" class="pol-img"/>
    <div class="pol-caption">You are a Cutiee, my Premii 💝</div>
    <div class="pol-sig">— Your Jamai, Your Baby ❤️</div>
  </div>
</div>

<!-- Next button -->
<div id="nextBtn">
  <a href="wishes.html">Next →</a>
</div>

<script>
// Guard
if(!sessionStorage.getItem('premii_unlocked')){
  window.location.href='index.html';
}

// Device capability
const isMobile=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)||window.innerWidth<768;
const isLow=(navigator.hardwareConcurrency||8)<=4;
const lite=isMobile||isLow;

// Stars
(function(){
  const c=document.getElementById('stars');
  const n=lite?35:90;
  for(let i=0;i<n;i++){
    const s=document.createElement('div');s.className='star';
    const sz=Math.random()*2.5+.5;
    Object.assign(s.style,{
      width:sz+'px',height:sz+'px',
      left:Math.random()*100+'%',top:Math.random()*100+'%',
      '--dur':(Math.random()*2+2)+'s','--delay':(Math.random()*4)+'s'
    });
    c.appendChild(s);
  }
})();

// Bunting flags
(function(){
  const b=document.getElementById('bunting');
  const colors=['#ff5fa3','#ffaa44','#3ecf7a','#4fb5ff','#a855f7','#f97316','#10b981','#06b6d4'];
  const n=Math.ceil(window.innerWidth/44)+4;
  for(let i=0;i<n;i++){
    const f=document.createElement('div');f.className='flag';
    f.style.setProperty('--c',colors[i%colors.length]);
    f.style.setProperty('--fd',(i*.08)+'s');
    b.appendChild(f);
  }
})();

// Floating hearts/petals
(function(){
  if(lite)return;
  const layer=document.getElementById('fxLayer');
  const items=['❤️','💕','💖','💗','🌸','🌹','✨','💫','🥀','🌺'];
  let active=0;const max=10;
  setInterval(()=>{
    if(active>=max)return;
    const el=document.createElement('div');
    el.className='fheart';
    el.textContent=items[Math.floor(Math.random()*items.length)];
    const sz=14+Math.random()*16;
    Object.assign(el.style,{
      left:Math.random()*100+'%',bottom:'-50px',
      '--fs':sz+'px','--dur':(6+Math.random()*5)+'s',
      '--del':(Math.random()*2)+'s'
    });
    layer.appendChild(el);active++;
    setTimeout(()=>{el.remove();active--;},12000);
  },900);
})();

// Balloon pop logic
let popped=0;const total=4;

document.querySelectorAll('.b-unit').forEach(unit=>{
  unit.addEventListener('click',()=>{
    if(unit.classList.contains('popped'))return;
    unit.classList.add('popped');
    popped++;

    // Ripple
    const rect=unit.getBoundingClientRect();
    const r=document.createElement('div');r.className='ripple';
    const cl=['#ff5fa3','#ffaa44','#3ecf7a','#4fb5ff'];
    Object.assign(r.style,{
      width:'80px',height:'80px',
      left:(rect.left+rect.width/2-40)+'px',
      top:(rect.top+rect.height/2-40)+'px',
      background:cl[popped-1],opacity:'.5'
    });
    document.body.appendChild(r);
    setTimeout(()=>r.remove(),700);

    // Particles burst
    burst(rect.left+rect.width/2, rect.top+rect.height/2);

    // Word appear
    setTimeout(()=>{
      const w=document.createElement('span');
      w.className='msg-word';
      w.textContent=unit.dataset.word;
      document.getElementById('msgStage').appendChild(w);
    },250);

    if(popped===total){
      setTimeout(celebrate,900);
    }
  });
});

function burst(cx,cy){
  const n=lite?8:18;
  const emojis=['✨','💫','⭐','🌟'];
  for(let i=0;i<n;i++){
    const p=document.createElement('div');
    Object.assign(p.style,{
      position:'fixed',left:cx+'px',top:cy+'px',
      fontSize:(12+Math.random()*10)+'px',
      pointerEvents:'none',zIndex:'9999',
      willChange:'transform,opacity',opacity:'1'
    });
    p.textContent=emojis[Math.floor(Math.random()*emojis.length)];
    const angle=(Math.PI*2*i)/n;
    const spd=5+Math.random()*5;
    const vx=Math.cos(angle)*spd,vy=Math.sin(angle)*spd;
    const start=Date.now();const dur=lite?400:700;
    document.body.appendChild(p);
    (function anim(){
      const el=Date.now()-start,prog=Math.min(el/dur,1);
      p.style.left=(cx+vx*el/20)+'px';
      p.style.top=(cy+vy*el/20-prog*100)+'px';
      p.style.opacity=''+(1-prog);
      if(prog<1)requestAnimationFrame(anim);else p.remove();
    })();
  }
}

function celebrate(){
  document.getElementById('mainTitle').classList.add('gone');
  document.getElementById('instruction').style.display='none';
  confetti();
  setTimeout(()=>document.getElementById('polaroid').classList.add('show'),1200);
  setTimeout(()=>document.getElementById('nextBtn').classList.add('show'),2200);
}

function confetti(){
  const c=document.getElementById('confetti');
  const colors=['#ff5fa3','#ffaa44','#3ecf7a','#4fb5ff','#a855f7','#fbbf24','#f472b6','#34d399'];
  const words=['Premii','💕','❤️','💖','🌹','✨','Cutiee'];
  const n=lite?70:220;
  for(let i=0;i<n;i++){
    const el=document.createElement('div');el.className='cf';
    el.style.left=Math.random()*100+'%';
    el.style.setProperty('--cd',(2+Math.random()*2.5)+'s');
    el.style.setProperty('--cde',(Math.random()*.5)+'s');
    if(i%3===0){
      el.textContent=words[Math.floor(Math.random()*words.length)];
      el.style.fontSize=(14+Math.random()*10)+'px';
      el.style.fontFamily="'Caveat',cursive";el.style.fontWeight='700';
      el.style.color=colors[Math.floor(Math.random()*colors.length)];
    } else {
      const sz=6+Math.random()*10;
      el.style.width=sz+'px';el.style.height=sz+'px';
      el.style.borderRadius=Math.random()>.5?'50%':'2px';
      el.style.background=colors[Math.floor(Math.random()*colors.length)];
    }
    c.appendChild(el);
  }
  setTimeout(()=>c.innerHTML='',4000);
}
</script>
</body>
</html>
