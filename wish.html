<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Happy Birthday My Farzan 💖</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎂</text></svg>"
    />
    <link rel="stylesheet" href="css/wish.css" />
  </head>
  <body>
    <!-- Animated Background Elements -->
    <canvas id="fireworks"></canvas>
    <div class="star-field" id="starField"></div>
    <div class="floating-hearts" id="floatingHearts"></div>
    <div class="sparkle-container" id="sparkles"></div>

    <!-- Main Content -->
    <div class="content-wrapper">
      <!-- Header Section -->
      <header class="header-section">
        <h1 class="main-title">🎉 Happy Birthday My Farzan 💖</h1>
        <div class="subtitle">
          You are the light of my life, my forever happiness 🌸
        </div>
      </header>

      <!-- Premii Text Section - The Star -->
      <section class="premii-section">
        <div class="premii-wrapper">
          <!-- Animated background glow -->
          <div class="glow-effect"></div>
          
          <!-- Main Text -->
          <div id="PremiiText" class="premii-text">
            <span class="letter" data-letter="P">P</span>
            <span class="letter" data-letter="R">R</span>
            <span class="letter" data-letter="E">E</span>
            <span class="letter" data-letter="M">M</span>
            <span class="letter" data-letter="I">I</span>
            <span class="letter" data-letter="I">I</span>
          </div>

 
      </section>
    </div>

    <script src="js/wish.js"></script>
  </body>
</html>
